configs:
  - name: OPENCHATCUT_RENDER_CONCURRENCY
    type: integer
    title:
      zh-CN: 视频渲染并发数
      en: Video Render Concurrency
    description:
      zh-CN: Remotion 渲染单个视频时使用的并发数；内存较小的设备建议设为 1。
      en: Remotion concurrency used for a single video render. Use 1 on memory-constrained devices.
    default: 2

  - name: OPENCHATCUT_MAX_ACTIVE_EXPORTS
    type: integer
    title:
      zh-CN: 最大同时导出任务数
      en: Maximum Active Exports
    description:
      zh-CN: 后端允许同时执行的重型视频导出任务数量。
      en: Maximum number of heavy video export jobs allowed to run concurrently.
    default: 1

  - name: OPENCHATCUT_FFMPEG_THREADS
    type: integer
    title:
      zh-CN: FFmpeg 线程数
      en: FFmpeg Threads
    description:
      zh-CN: 每个 FFmpeg 任务可使用的最大线程数。
      en: Maximum number of threads available to each FFmpeg operation.
    default: 4

  - name: OPENCHATCUT_WEBDAV_URL
    type: string
    title:
      zh-CN: WebDAV 地址
      en: WebDAV URL
    description:
      zh-CN: 可选。填写 WebDAV 根目录地址后，可从素材库直接浏览并导入媒体。
      en: Optional WebDAV root URL for browsing and importing media from the media pool.
    default: ""

  - name: OPENCHATCUT_IMMICH_URL
    type: string
    title:
      zh-CN: AI 相册地址
      en: AI Album URL
    description:
      zh-CN: Immich 服务地址；同一 VOS 内留空可自动走平台网关，独立服务可填写 http://192.168.1.10:2283。无需附加 /api。
      en: Immich service URL. Leave empty to use the VOS gateway, or enter a standalone address such as http://192.168.1.10:2283. Do not append /api.
    default: ""

  - name: OPENCHATCUT_VOS_SHARED_EXPOSED_ENABLED
    type: boolean
    title:
      zh-CN: 共享 VOS 授权目录
      en: Shared VOS Exposed Directory
    description:
      zh-CN: 默认关闭以避免多用户互相看到授权目录。仅当挂载内容是所有 V-ChatCut 用户都可访问的公共素材库时开启。
      en: Disabled by default to prevent cross-user browsing. Enable only when the mounted content is a public library shared by every V-ChatCut user.
    default: false

  - name: OPENCHATCUT_VOS_OIDC_USERINFO_URL
    type: string
    title:
      zh-CN: VOS OIDC 用户信息地址
      en: VOS OIDC Userinfo URL
    description:
      zh-CN: 后端校验 VOS Fastpath access token 使用的 /v1000/oauth2/userinfo 地址。
      en: Reachable /v1000/oauth2/userinfo endpoint used to verify VOS Fastpath access tokens.
    default: http://172.17.0.1:8105/v1000/oauth2/userinfo
